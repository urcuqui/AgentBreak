name: AI Security Gate

# Every successful AI attack becomes a security test; this gate replays them all.
# Order is intentional: pytest proves the project still works (including the
# workshop-patch test), then `agentbreak verify` proves the security posture
# still holds. Either failing fails the build.

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  ai-security:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install AgentBreak
        id: install
        run: pip install -e ".[dev]"

      - name: Run test suite
        run: pytest

      # Runs even if pytest failed, so a security regression still shows up as
      # SECURITY GATE: FAILED in the logs (the job fails either way).
      - name: Run AI security regression gate
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m agentbreak verify

      - name: Upload security regression report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-regression-report
          path: |
            artifacts/security_regression_report.json
            artifacts/security_regression_report.md
          if-no-files-found: ignore
